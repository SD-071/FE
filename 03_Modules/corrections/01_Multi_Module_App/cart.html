<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake E-Commerce</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 flex flex-col min-h-screen gap-4">
    <header class="flex text-[10px] bg-neutral-200">
      <nav class="flex justify-between items-center w-full p-4">
        <div id="logo">
          <h1 class="font-bold text-pink-800 hover:text-pink-600">Fake E-Commerce Store</h1>
        </div>
        <ul id="nav-links" class="flex justify-end items-center w-1/2 gap-4">
          <li class="text-pink-800 hover:text-pink-600 font-bold"><a href="./index.html">Home</a></li>
          <li>
            <a
              href="#"
              id="cart-button"
              class="text-[6px] bg-pink-800 hover:bg-pink-600 text-white font-bold p-2 rounded-2xl"
            >
              Cart (<span id="cart-count">0</span>)
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="flex flex-col p-4 m-4 gap-4 bg-neutral-200 rounded-xl items-center">
      <h1 class="text-md font-bold">In your Cart</h1>
      <div id="products-container" class="flex flex-wrap justify-center gap-4"></div>
    </main>
    <footer></footer>
    <script type="module" src="./src/cart.js"></script>
  </body>
</html>
